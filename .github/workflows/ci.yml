# Every pull request: lint, then run the tests. The suite ends with a smoke
# test that builds the workload, times a short batch on DuckDB, trains,
# publishes and exports -- the whole solution, on real measurements.
# Nothing merges red.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**", "state/**", "data/**", "artifacts/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ruff
        run: ruff check src scripts tests
      - name: pytest
        run: pytest
