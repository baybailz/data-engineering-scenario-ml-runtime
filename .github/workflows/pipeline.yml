# One dispatchable workflow = one run of the solution:
# measure the next batch -> retrain -> publish the tables -> export JSON for
# the page. Fails closed: a failed check commits nothing.
name: pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        default: measure_batch
        options: [measure_batch, reset]

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTION: ${{ inputs.action || 'measure_batch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # shell: bash => pipefail, so a failing step still fails through tee
      - name: Measure, train and publish
        shell: bash
        run: python scripts/run.py --action "$ACTION" 2>&1 | tee /tmp/run.log

      - name: Export JSON for the page
        run: python scripts/export_json.py --action "$ACTION" --log /tmp/run.log

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state data artifacts docs/data
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "pipeline: $ACTION ($(date -u +%FT%TZ))"
          git pull --rebase -X theirs origin main || true
          git push
