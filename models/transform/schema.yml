version: 2

models:
  - name: trn_tbl_query_run
    description: One measured run per query, with the pre-run features typed.
    columns:
      - name: query_id
        data_tests: [unique, not_null]
      - name: normalized_seconds
        data_tests: [not_null]
      - name: has_groupby
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["yes", "no"]
      - name: has_orderby
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["yes", "no"]
      - name: has_window
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["yes", "no"]
  - name: trn_tbl_query_prediction
    description: Every prediction beside the run it predicted, with the error.
    columns:
      - name: prediction_key
        data_tests: [unique, not_null]
      - name: prediction_scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [holdout, cross_validated]
