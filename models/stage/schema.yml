version: 2

models:
  - name: stg_query_run
    description: Measured query runs, typed and renamed.
    columns:
      - name: query_id
        data_tests: [unique, not_null]
      - name: median_seconds
        data_tests: [not_null]
  - name: stg_prediction
    description: One prediction per measured query per model version.
    columns:
      - name: query_id
        data_tests: [not_null]
      - name: model_version
        data_tests: [not_null]
  - name: stg_model_version
    description: One row per trained model.
    columns:
      - name: model_version
        data_tests: [unique, not_null]
