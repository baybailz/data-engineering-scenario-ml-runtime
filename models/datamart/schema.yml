version: 2

models:
  - name: dm_runtime_sla
    description: Predicted and measured runtime per query shape against the SLA.
    columns:
      - name: template_id
        data_tests: [unique, not_null]
      - name: sla_verdict
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [inside_sla, breach_called, missed_breach, false_alarm]
  - name: dm_prediction_detail
    description: The published model's prediction per query, joined to its shape.
    columns:
      - name: query_id
        data_tests: [unique, not_null]
      - name: prediction_scope
        data_tests:
          - accepted_values:
              arguments:
                values: [holdout, cross_validated]
  - name: dm_model_scorecard
    description: Every trained model in order, with the error it was scored at.
    columns:
      - name: model_version
        data_tests: [unique, not_null]
      - name: gate_status
        data_tests:
          - accepted_values:
              arguments:
                values: [pass, fail]
