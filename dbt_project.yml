# Project config. Layers follow the conventions in CONVENTIONS.md:
# stage (views) -> transform (tables) -> conformed (incremental on a key)
# -> datamart (views). Materialization and tags are declared per folder here
# and may be tightened inside a model's config() block.
name: scenario
version: "1.0.0"
profile: scenario

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets: ["target", "dbt_packages"]

# The runtime SLA the datamart judges every query shape against. One place,
# because operations changes it more often than anyone changes a model.
vars:
  sla_seconds: 0.2

data_tests:
  scenario:
    +store_failures: true
    +schema: dbt_audit

seeds:
  scenario:
    +tags: ["scenario"]

models:
  scenario:
    +tags: ["scenario"]
    stage:
      +materialized: view
      +tags: ["stage"]
    transform:
      +materialized: table
      +tags: ["transform"]
    conformed:
      +materialized: incremental
      +tags: ["conformed", "master_data"]
      +post-hook: "{{ metadata_audit() }}"
    datamart:
      +materialized: view
      +tags: ["datamart"]
      +post-hook: "{{ metadata_audit() }}"

on-run-start:
  - "{{ create_audit_table() }}"
